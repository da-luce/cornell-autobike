nodes:
  - name: "MY_ROBOT_DRIVER"
    input_topics:
      - topic: "/cmd_vel"
        type: "Twist"
        description: Manual velocity command from terminal
      - topic: "/angle"
        type: "Float32"
        description: Steering angle as float to adjust wheel velocities.
      - topic: "/lidar"
        type: "LaserScan"
        description: Raw laser scan data for point cloud generation.
    output_topics:
      - topic: "/pointcloud"
        type: "PointCloud2"
        description: Point cloud data generated from LiDAR scan.
      - topic: "/gps"
        type: "NavSatFix"
        description: GPS location including latitude, longitude, and altitude.
      - topic: "/gyro"
        type: "Imu"
        description: IMU angular velocity from gyroscope sensor.
      - topic: "/camera"
        type: "Image"
        description: Raw image data from the robot's optical camera.

  - name: "PUREPURSUIT"
    output_topics:
      - topic: "/steering_angle"
        type: "Twist"
        description: Steering commands generated by the Pure Pursuit algorithm

  - name: "LIDAR_SENSOR"
    output_topics:
      - topic: "/lidar"
        type: "LaserScan"
        description: Laser scan data from the robot's LiDAR sensor

  - name: "GPS_SENSOR"
    output_topics:
      - topic: "/gps_raw"
        type: "NavSatFix"
        description: Raw GPS data

  - name: "GYRO_SENSOR"
    output_topics:
      - topic: "/gyro_raw"
        type: "Imu"
        description: Raw gyroscope data

  - name: "CAMERA_SENSOR"
    output_topics:
      - topic: "/camera_raw"
        type: "Image"
        description: Raw image frames
